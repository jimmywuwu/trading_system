# 過濾器配置文件

filters:
  # 全局過濾器
  global:
    - type: "drawdown"
      max_drawdown: 0.15
    - type: "position_limit"
      max_positions: 5

  # 交易對特定過濾器
  symbols:
    BTCUSDT:
      - type: "volume"
        min_volume: 1000000
      - type: "price"
        min_price: 20000
        max_price: 100000
    
    ETHUSDT:
      - type: "volume"
        min_volume: 500000
      - type: "price"
        min_price: 1000

  # 策略特定過濾器
  strategies:
    momentum_strategy:
      entry:
        - type: "volume"
          min_volume: 500000
        - type: "volatility"
          min_volatility: 0.02
          period: 20
        - type: "time"
          start_hour: 9
          end_hour: 15
      exit:
        - type: "time"
          start_hour: 15
          end_hour: 16
    
    mean_reversion_strategy:
      entry:
        - type: "volume"
          min_volume: 300000
        - type: "volatility"
          min_volatility: 0.015
      exit:
        - type: "time"
          start_hour: 14
          end_hour: 16