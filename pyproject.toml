[project]
name = "trading-system"
version = "0.2.0"
description = "Point-in-time research and backtest system: Provider -> Observation -> Signal -> Strategy -> OrderIntent -> Execution"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["core", "providers", "signals", "strategies", "execution", "backtest", "research"]
